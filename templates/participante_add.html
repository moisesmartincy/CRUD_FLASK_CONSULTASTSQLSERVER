{% extends 'base.html' %}

{% block title %}Registrar Participante{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card card-custom shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0 fw-bold"><i class="bi bi-person-plus-fill me-2"></i>Registrar Nuevo Participante</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="codPar" class="form-label fw-bold">Código Participante <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="codPar" name="codPar" placeholder="Ej: par15" maxlength="5" required autofocus>
                            <div class="form-text">Máximo 5 caracteres (PK única).</div>
                        </div>

                        <div class="col-md-8">
                            <label for="nombre" class="form-label fw-bold">Nombre <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Nombre de pila" maxlength="15" required>
                        </div>

                        <div class="col-md-6">
                            <label for="paterno" class="form-label fw-bold">Apellido Paterno <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="paterno" name="paterno" placeholder="Apellido paterno" maxlength="15" required>
                        </div>

                        <div class="col-md-6">
                            <label for="materno" class="form-label fw-bold">Apellido Materno <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="materno" name="materno" placeholder="Apellido materno" maxlength="15" required>
                        </div>

                        <div class="col-md-4">
                            <label for="fecnac" class="form-label fw-bold">Fecha de Nacimiento</label>
                            <input type="date" class="form-control" id="fecnac" name="fecnac">
                        </div>

                        <div class="col-md-4">
                            <label for="sexo" class="form-label fw-bold">Sexo <span class="text-danger">*</span></label>
                            <select class="form-select" id="sexo" name="sexo" required>
                                <option value="" disabled selected>Seleccione...</option>
                                <option value="v">Varón (v)</option>
                                <option value="m">Mujer (m)</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="tipo" class="form-label fw-bold">Tipo de Rol <span class="text-danger">*</span></label>
                            <select class="form-select" id="tipo" name="tipo" required>
                                <option value="" disabled selected>Seleccione...</option>
                                <option value="b">Bailarín (b)</option>
                                <option value="j">Jurado (j)</option>
                                <option value="c">Coach (c)</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label for="codIns" class="form-label fw-bold">Institución / Academia Perteneciente</label>
                            <select class="form-select" id="codIns" name="codIns">
                                <option value="">-- Sin Institución Asignada (NULL) --</option>
                                {% for ins in instituciones %}
                                    <option value="{{ ins[0] }}">{{ ins[1] }} ({{ ins[0] }})</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                        <a href="{{ url_for('index') }}" class="btn btn-secondary">
                            <i class="bi bi-x-circle me-1"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check2-circle me-1"></i> Guardar Participante
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
